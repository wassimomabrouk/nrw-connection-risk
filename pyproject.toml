[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrw-connection-risk"
version = "0.1.0"
description = "Predicting missed train connections at NRW hubs from live Deutsche Bahn timetable data."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyarrow>=15",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "duckdb>=1.1", "pandas>=2.2"]

[project.scripts]
nrw-collector = "nrw_connection_risk.collector.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

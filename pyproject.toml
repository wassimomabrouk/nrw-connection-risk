[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrw-connection-risk"
version = "0.1.0"
description = "Predicting missed train connections at NRW hubs from live Deutsche Bahn timetable data."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyarrow>=15",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
data = ["duckdb>=1.1", "pandas>=2.2"]
model = ["scikit-learn>=1.5"]
serve = ["duckdb>=1.1", "pandas>=2.2", "scikit-learn>=1.5", "fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "duckdb>=1.1", "pandas>=2.2", "scikit-learn>=1.5", "fastapi>=0.110", "uvicorn>=0.29",
       "httpx>=0.27", "httpx2>=2.0"]

[project.scripts]
nrw-collector = "nrw_connection_risk.collector.main:main"
nrw-dataset = "nrw_connection_risk.dataset.build:main"
nrw-features = "nrw_connection_risk.features.build:main"
nrw-evaluate = "nrw_connection_risk.training.evaluate:main"
nrw-fit-bundle = "nrw_connection_risk.training.fit_bundle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
